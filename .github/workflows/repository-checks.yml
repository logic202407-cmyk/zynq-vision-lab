name: Source and submission checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install existing viewer test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk python3-pil python3-pil.imagetk
      - name: Check repository structure and claims
        run: python3 tools/check_repository.py
      - name: Test repository tooling
        run: python3 -m unittest discover -s tests -v
      - name: Check SkyStar wiring metadata
        run: python3 tools/check_skystar_wiring.py
      - name: Compile and test host-only gimbal registry
        shell: bash
        run: |
          fw=src/prototype/skystar_openmv/stm32_skystar_tracking/user
          pid=src/prototype/skystar_openmv/stm32_project/user
          gcc -std=c99 -Wall -Wextra -Werror -O2 -I"$fw" -I"$pid" \
            sim/c1/registry_checks.c "$fw/gimbal_registry.c" \
            "$fw/tracking.c" "$fw/safety.c" "$pid/pid.c" -lm -o "$RUNNER_TEMP/registry-check"
          "$RUNNER_TEMP/registry-check"
      - name: Check reusable frame-result skill
        run: python3 tools/compare_frame_records.py --actual skill/frame-result-check/examples/actual.json --reference skill/frame-result-check/examples/reference.json
      - name: Clarify verification boundary
        run: echo 'Repository checks only. No FPGA simulation, implementation or board test has run.'
