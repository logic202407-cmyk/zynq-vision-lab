name: Repository foundations (not FPGA verification)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check repository structure and claims
        run: python tools/check_repository.py
      - name: Select Python 3.12 with Tk
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare UI regression dependencies
        run: |
          python -m pip install -r src/pc/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys, PIL, tkinter; print(sys.version); print('Pillow', PIL.__version__); print('Tk', tkinter.TkVersion)"
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - name: Clarify verification boundary
        run: echo 'Repository checks only. No FPGA simulation, implementation or board test has run.'
